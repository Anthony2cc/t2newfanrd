[package]
name = "t2newfanrd"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "T2 fan control daemon and system tray frontend"
repository = "https://github.com/Anthony2cc/t2newfanrd"

[lib]
name = "t2newfanrd"
path = "src/lib.rs"

[[bin]]
name = "t2newfanrd"
path = "src/main.rs"

[[bin]]
name = "t2newfanrd-tray"
path = "src/bin/tray.rs"

[dependencies]
glob = { version = "0.3.1", default-features = false }
libc = { version = "0.2.149", default-features = false }
nonempty = { version = "0.10.0", default-features = false }
rust-ini = { version = "0.21.0", default-features = false }
thiserror = { version = "1.0.50", default-features = false }
signal-hook = { version = "0.3.17", default-features = false }
arraydeque = "0.5.1"
gtk4 = "0.11"
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
